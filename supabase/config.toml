# ═══════════════════════════════════════════════════════════
# SEP · Configuración de Supabase
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# ═══════════════════════════════════════════════════════════

project_id = "sep-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Tope de filas por consulta: evita que un select sin filtro tumbe la API.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# `seed.sql`  → datos de referencia (cursos, planes, 45 preguntas). Va a producción.
# `seeds/demo.sql` → ecosistema de demostración. SOLO local/staging.
sql_paths = ["./seed.sql", "./seeds/demo.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Mínimo 10 caracteres — Plan Maestro §9.1
[auth.email.template.confirmation]
subject = "Confirma tu correo · SEP"

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
# Cierre de sesión tras 30 días de inactividad.
inactivity_timeout = "720h"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
